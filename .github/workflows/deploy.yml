name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_pipeline
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ── Checkout code ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Set up Python ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Install dependencies ───────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ── Run tests ──────────────────────────────────
      - name: Run tests
        run: |
          python tests/run_tests.py
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@localhost/test_pipeline

      # ── Deploy exact validated commit to Oracle VM ─
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.VM_HOST }}
          username:        ${{ secrets.VM_USER }}
          key:             ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.VM_PATH }}

            # Pre-flight: root-owned wrappers must exist on the VM.
            # Both are created by "sudo bash deploy/install-systemd.sh" (run once on the VM).
            for _wrapper in /usr/local/bin/install-pipeline-units /usr/local/bin/sync-pipeline-staging; do
              if [[ ! -x "$_wrapper" ]]; then
                echo "[ERROR] $_wrapper not found."
                echo "        Run 'sudo bash deploy/install-systemd.sh' once on the VM to provision it."
                exit 1
              fi
            done

            echo "[1/8] Upgrading pip..."
            source venv/bin/activate
            pip install --upgrade pip --quiet
            python --version

            echo "[2/8] Fetching latest code..."
            git fetch --all
            PREVIOUS_SHA=$(git rev-parse HEAD)

            # Shared rollback helper used by both _early_rollback (ERR trap) and
            # the health-check failure branch.  Reverts code, deps, unit files,
            # and restarts services — each step guarded so a failure logs clearly
            # rather than exiting silently under set -e.
            _rollback_to_sha() {
              local _sha="${1:-$PREVIOUS_SHA}"
              local _checkout_ok=true
              git reset --hard HEAD 2>/dev/null || true
              if ! git checkout -B main "$_sha"; then
                echo "[FATAL] git rollback to $_sha failed — code state unknown"
                _checkout_ok=false
              fi
              if $_checkout_ok; then
                pip install -r requirements.txt --quiet || echo "[FATAL] pip rollback failed"
                echo "[ROLLBACK] Re-syncing unit files..."
                sudo /usr/local/bin/install-pipeline-units || echo "[WARN] unit sync failed during rollback"
                sudo systemctl daemon-reload || echo "[WARN] daemon-reload failed during rollback"
              else
                echo "[WARN] Skipping pip install and unit sync — code state unknown"
              fi
              # llama-server and h1b-llm-worker excluded — see [7/8] comment above
              for svc in recruiter-scheduler recruiter-watchdog pipeline-api recruiter-manager email-processor streamlit-frontend; do
                sudo systemctl restart "$svc" || echo "[WARN] could not restart $svc during rollback"
              done
            }

            # Early-failure rollback trap: if any step before the long health-check
            # fails, revert to PREVIOUS_SHA and attempt to restore service state.
            _early_rollback() {
              local _exit=$?
              echo "[ERROR] Early deploy step failed (exit $_exit) — rolling back to $PREVIOUS_SHA"
              _rollback_to_sha "$PREVIOUS_SHA"
              echo "[ROLLBACK] Verifying rollback services are active..."
              sleep 3
              for svc in recruiter-scheduler recruiter-watchdog pipeline-api recruiter-manager email-processor streamlit-frontend; do
                if ! systemctl is-active --quiet "$svc"; then
                  echo "[ERROR] $svc failed to start after rollback:"
                  journalctl -u "$svc" -n 30 --no-pager || true
                  echo "[FATAL] Rollback failed — manual intervention required"
                else
                  echo "[OK] $svc is active after rollback"
                fi
              done
              exit $_exit
            }
            trap '_early_rollback' ERR

            echo "[3/8] Checking out exact validated commit..."
            git reset --hard HEAD
            git checkout -B main ${{ github.sha }}

            echo "[4/8] Installing dependencies..."
            pip install -r requirements.txt --quiet

            echo "[5/8] Verifying PostgreSQL connection..."

            python - <<'PY'
            import sys
            sys.path.insert(0, '.')
            from dotenv import load_dotenv
            load_dotenv('.env')   # explicit path — find_dotenv() fails on stdin
            from db.connection import get_conn
            conn = get_conn()
            row = conn.execute("SELECT COUNT(*) AS cnt FROM prospective_companies").fetchone()
            print(f"[OK] PostgreSQL OK — prospective_companies has {row['cnt']} rows")
            conn.close()
            PY

            echo "[6/8] Syncing systemd unit files..."
            sudo /usr/local/bin/sync-pipeline-staging
            sudo /usr/local/bin/install-pipeline-units
            echo "  systemd unit files installed"
            sudo systemctl daemon-reload
            echo "  systemd daemon reloaded"

            echo "[7/8] Restarting services..."
            # llama-server and h1b-llm-worker are intentionally excluded from this loop:
            #   llama-server: model load takes minutes; TimeoutStartSec=infinity; systemd
            #                 restarts it on failure; h1b-llm-worker depends on it via Requires=.
            #   h1b-llm-worker: runs only during H1B batch jobs (quarterly/yearly); systemd
            #                   starts it automatically when llama-server becomes active.
            # cloudflare-tunnel excluded: restarting it invalidates tunnel URLs on every deploy.
            # Both llama-server and h1b-llm-worker are covered by step [6/8] unit sync and watchdog.
            # Pre-restart Redis cleanup so the new scheduler starts with a clean slate:
            # 1. XACK any PEL entries from the current (about-to-die) scheduler — removes
            #    them cleanly so they never become "stuck dead-consumer" entries after restart.
            # 2. Clear inflight:scans ZSETs — accumulated entries from prior restarts cause
            #    the ceiling check to block all dispatch (dispatched=0 stall) in the new scheduler.
            _pending_ids=$(redis-cli XPENDING stream:adaptive scan-workers - + 100 2>/dev/null | awk '{print $1}' | tr '\n' ' ')
            if [ -n "$_pending_ids" ]; then
              redis-cli XACK stream:adaptive scan-workers $_pending_ids > /dev/null || true
              echo "  Pre-restart: ACKed PEL entries ($_pending_ids)"
            fi
            redis-cli --scan --pattern 'inflight:scans:*' 2>/dev/null | xargs -r redis-cli DEL > /dev/null || true
            echo "  Pre-restart: cleared inflight:scans ZSETs"
            # 3. Clear any stale Lever 1 keys — a Lever 1 left over from a prior manager
            #    instance (TTL -1, permanent) blocks all adaptive dispatch indefinitely.
            #    The new manager's startup re-evaluation will re-fire Lever 1 within 60s
            #    if conditions still warrant it.
            redis-cli DEL manager:lever1:scan:active manager:lever1:scan:fired_at \
                          manager:lever1:fullscan:active manager:lever1:fullscan:fired_at > /dev/null || true
            echo "  Pre-restart: cleared stale Lever 1 keys"
            for svc in recruiter-scheduler recruiter-watchdog pipeline-api recruiter-manager email-processor streamlit-frontend; do
              if ! systemctl cat "$svc" &>/dev/null; then
                echo "[ERROR] $svc unit not found after systemd sync — check deploy/systemd/"
                false  # trigger ERR trap → _early_rollback runs
              fi
              sudo systemctl restart "$svc"
            done
            # llama-server: try-restart only if already running (model load takes minutes;
            # no-op when stopped so quarterly batch jobs aren't accidentally started).
            # h1b-llm-worker follows automatically via systemd Requires=llama-server.
            sudo systemctl try-restart llama-server || true

            echo "[8/8] Verifying services are active..."
            sleep 3   # brief settle: systemctl restart returns once the process starts, not fully active
            for svc in recruiter-scheduler recruiter-watchdog pipeline-api recruiter-manager email-processor streamlit-frontend; do
              if ! systemctl is-active --quiet "$svc"; then
                echo "[ERROR] $svc failed to start after restart:"
                journalctl -u "$svc" -n 30 --no-pager || true
                false  # trigger ERR trap → _early_rollback runs
              fi
              echo "[OK] $svc is active"
            done

            # All pre-health-check steps passed — disable the early-failure trap
            # before the long health-check sleep to avoid rolling back on
            # non-fatal signals (e.g. SIGPIPE from pipeline subshells).
            trap - ERR

            echo "  Running health check to verify pipeline state..."
            sleep 70   # fullscan_worker writes heartbeat every 60s — wait at least that long
            source venv/bin/activate
            if ! python scripts/health_check.py; then
              echo "[ERROR] Health check failed — rolling back to $PREVIOUS_SHA"
              _rollback_to_sha "$PREVIOUS_SHA"

              echo "[ROLLBACK] Verifying rollback services are active..."
              sleep 3
              for svc in recruiter-scheduler recruiter-watchdog pipeline-api recruiter-manager email-processor streamlit-frontend; do
                if ! systemctl is-active --quiet "$svc"; then
                  echo "[ERROR] $svc failed to start after rollback:"
                  journalctl -u "$svc" -n 30 --no-pager || true
                  echo "[FATAL] Rollback failed — manual intervention required"
                  exit 1
                fi
                echo "[OK] $svc is active after rollback"
              done

              echo "[ROLLBACK] Re-running health check to confirm pipeline is healthy..."
              sleep 70
              if ! python scripts/health_check.py; then
                echo "[FATAL] Health check still failing after rollback to $PREVIOUS_SHA"
                echo "[FATAL] Pipeline is unhealthy — manual intervention required"
                exit 1
              fi
              echo "[ROLLBACK] Health check passed"

              echo "[ROLLBACK] Complete — reverted to $PREVIOUS_SHA"
              exit 1
            fi

            echo "Deploy complete ✓"
            echo "Deployed commit: ${{ github.sha }}"
            echo "Deployed at: $(date)"
